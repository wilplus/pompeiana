<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="pompeiana">
  <!-- Based on the WillpowerLab mark: small·big·small dots (#111) on white.
       Two dots added (top + bottom of the center dot) to form a Latin cross. -->
  <rect width="512" height="512" fill="#ffffff"/>
  <g fill="#111111">
    <circle cx="130" cy="230" r="35"/>
    <circle cx="256" cy="230" r="51"/>
    <circle cx="382" cy="230" r="35"/>
    <circle cx="256" cy="112" r="35"/>
    <circle cx="256" cy="400" r="35"/>
  </g>
</svg>
